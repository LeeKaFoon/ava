<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广东高考英语听说·三问训练 v2</title>
    <!-- 在线版：依赖 Tailwind CDN 与 Google Fonts，需要联网 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .heading-font {
            font-family: 'Lexend', sans-serif;
        }
        .filter-btn {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 500;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        @media (min-width: 640px) {
            .filter-btn { font-size: 0.875rem; padding: 0.5rem 1rem; }
        }
        .filter-btn:hover { background: #e2e8f0; }
        .filter-btn.active {
            background: #2563eb;
            color: #fff;
        }
        .filter-btn.mock-special {
            background: #f5f3ff;
            color: #5b21b6;
            border-color: #ddd6fe;
        }
        .filter-btn.mock-special:hover { background: #ede9fe; }
        .filter-btn.mock-special.active {
            background: #5b21b6;
            color: #fff;
            border-color: transparent;
        }
        .filter-select {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #475569;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.375rem 2rem 0.375rem 0.75rem;
            cursor: pointer;
            min-width: 8.5rem;
            max-width: 100%;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .filter-select:hover {
            border-color: #cbd5e1;
            background: #fff;
        }
        .filter-select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgb(37 99 235 / 0.2);
        }
        .filter-select.year-active {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
        }
        @media (min-width: 640px) {
            .filter-select { font-size: 0.875rem; padding: 0.5rem 2.25rem 0.5rem 1rem; }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 shrink-0 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm font-bold heading-font">Q</div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-lg font-bold heading-font text-slate-800 tracking-tight truncate">听说三问训练</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">真题速刷 · 模拟拓展 · <span class="text-blue-600/80">v2</span></p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 sm:p-8 space-y-6">

            <div id="filterGroup" class="flex flex-col items-stretch gap-3 sm:gap-2 max-w-xl mx-auto w-full"></div>

            <div id="progressWrap" class="hidden space-y-2 max-w-md mx-auto w-full">
                <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-blue-500 rounded-full transition-[width] duration-300 ease-out" style="width:0%"></div>
                </div>
                <p id="progressLabel" class="text-center text-xs text-slate-500 tabular-nums"></p>
            </div>

            <div class="text-center space-y-3 pt-1">
                <span id="yearTag" class="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full tracking-wide">Ready</span>
                <p id="questionText" class="text-lg sm:text-xl font-semibold text-slate-800 leading-relaxed min-h-[4.5rem] flex items-center justify-center text-center">准备好了吗？<br>先口头组织英文，再对照参考。</p>
            </div>

            <button type="button" id="answerRevealBtn"
                class="w-full text-left rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/60 hover:bg-slate-50 hover:border-blue-200 transition-colors duration-200 px-5 py-5 min-h-[88px] flex flex-col justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
                <span id="hintText" class="text-center text-sm text-slate-400 w-full">点击展开英文参考答案</span>
                <div id="answerText" class="hidden w-full text-left text-base text-blue-700 font-medium leading-relaxed space-y-2"></div>
            </button>

            <div id="startBtnContainer">
                <button type="button" id="btnStart"
                    class="w-full py-3 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm sm:text-base shadow-sm transition-colors active:scale-[0.99] duration-150">开始训练</button>
            </div>

            <div id="reviewControls" class="hidden flex flex-col sm:flex-row gap-3">
                <button type="button" id="btnStuck"
                    class="flex-1 py-3 px-5 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold text-sm hover:bg-slate-50 hover:border-slate-300 transition-colors active:scale-[0.99] duration-150">卡壳了，再看一遍</button>
                <button type="button" id="btnMastered"
                    class="flex-1 py-3 px-5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm shadow-sm transition-colors active:scale-[0.99] duration-150">已掌握，下一题</button>
            </div>

            <div class="flex flex-wrap justify-between gap-2 text-xs text-slate-500 border-t border-slate-100 pt-5">
                <span>当前题库 <strong id="poolSize" class="text-slate-700 font-semibold tabular-nums">0</strong> 题</span>
                <span>本轮已掌握 <strong id="masteredCount" class="text-emerald-600 font-semibold tabular-nums">0</strong> 题</span>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-3 px-4 mt-auto">
        <div class="max-w-5xl mx-auto text-center text-xs text-slate-400 leading-relaxed space-y-1">
            <p>建议先自答再点开参考；掌握后可从本轮题库中移除该题。上次选择的题组会自动记住。</p>
            <p class="text-slate-500">快捷键：<kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">R</kbd> / <kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">Enter</kbd> / <kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">Space</kbd> 展开参考 · <kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">Esc</kbd> 收起 · <kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">1</kbd> 卡壳 · <kbd class="px-1 py-0.5 rounded bg-slate-100 font-mono text-[0.7rem]">2</kbd> 已掌握</p>
        </div>
    </footer>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-slate-800 text-white text-sm rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-[100] max-w-[min(90vw,20rem)] text-center"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>


</body>

</html>
